<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="85%" r="80%">
      <stop offset="0" stop-color="#14328f"/>
      <stop offset="0.55" stop-color="#050b26"/>
      <stop offset="1" stop-color="#01030a"/>
    </radialGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9dbff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#6f8dff" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b7dff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#1a2f8f" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a58d6" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#0d1c66" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- the boot towers, faint -->
  <g fill="#6f8dff" opacity="0.18">
    <rect x="40" y="380" width="26" height="132"/>
    <rect x="86" y="340" width="26" height="172"/>
    <rect x="400" y="350" width="26" height="162"/>
    <rect x="446" y="395" width="26" height="117"/>
  </g>
  <!-- a memory-card save icon: a glassy cube -->
  <g filter="url(#glow)" stroke="#dbe7ff" stroke-width="5" stroke-linejoin="round">
    <path d="M256 112 L392 188 L256 264 L120 188 Z" fill="url(#top)"/>
    <path d="M120 188 L256 264 L256 416 L120 340 Z" fill="url(#left)"/>
    <path d="M392 188 L256 264 L256 416 L392 340 Z" fill="url(#right)"/>
  </g>
</svg>
